<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="574" viewBox="0 0 1040 574" role="img" aria-labelledby="t d">
<title id="t">One file to a backend</title>
<desc id="d">An excerpt of teenybase.ts (a users table with the auth and rules extensions) becomes, after teeny deploy, a REST API, auth endpoints, rules compiled to SQL, generated migrations, an OpenAPI spec with Swagger UI and an admin panel, running on your own Cloudflare account (Workers + D1).</desc>
<style>.bg{fill:#ffffff}.card{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}.band{fill:#eef1f4;stroke:#d0d7de;stroke-width:1}.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace}.tx{fill:#1f2328}.mu{fill:#59636e}.ac{fill:#0969da}.st{fill:#0a3069}.ky{fill:#8250df}.ln{stroke:#0969da;stroke-width:2;fill:none}.hd{stroke:#d0d7de;stroke-width:1}</style>
<rect class="bg" width="1040" height="574" rx="12"/>
<rect class="card" x="20" y="20" width="500" height="440" rx="10"/>
<line class="hd" x1="20" y1="64" x2="520" y2="64"/>
<text class="sans tx" x="40" y="48" font-size="16" font-weight="600">teenybase.ts</text>
<text class="sans mu" x="500" y="48" font-size="14" text-anchor="end">excerpt, with-auth template</text>
<text class="mono" x="40" y="104" font-size="14.5" xml:space="preserve"><tspan class="tx">export default {</tspan></text>
<text class="mono" x="40" y="128" font-size="14.5" xml:space="preserve"><tspan class="tx">  </tspan><tspan class="ky">tables</tspan><tspan class="tx">: [{</tspan></text>
<text class="mono" x="40" y="152" font-size="14.5" xml:space="preserve"><tspan class="tx">    </tspan><tspan class="ky">name</tspan><tspan class="tx">: </tspan><tspan class="st">'users'</tspan><tspan class="tx">,</tspan></text>
<text class="mono" x="40" y="176" font-size="14.5" xml:space="preserve"><tspan class="tx">    </tspan><tspan class="ky">fields</tspan><tspan class="tx">: [...baseFields, ...authFields],</tspan></text>
<text class="mono" x="40" y="200" font-size="14.5" xml:space="preserve"><tspan class="tx">    </tspan><tspan class="ky">extensions</tspan><tspan class="tx">: [</tspan></text>
<text class="mono" x="40" y="224" font-size="14.5" xml:space="preserve"><tspan class="tx">      { </tspan><tspan class="ky">name</tspan><tspan class="tx">: </tspan><tspan class="st">'auth'</tspan><tspan class="tx">, </tspan><tspan class="ky">jwtSecret</tspan><tspan class="tx">: </tspan><tspan class="st">'$JWT_SECRET_USERS'</tspan><tspan class="tx">,</tspan></text>
<text class="mono" x="40" y="248" font-size="14.5" xml:space="preserve"><tspan class="tx">        </tspan><tspan class="ky">jwtTokenDuration</tspan><tspan class="tx">: 3600 },</tspan></text>
<text class="mono" x="40" y="272" font-size="14.5" xml:space="preserve"><tspan class="tx">      { </tspan><tspan class="ky">name</tspan><tspan class="tx">: </tspan><tspan class="st">'rules'</tspan><tspan class="tx">,</tspan></text>
<text class="mono" x="40" y="296" font-size="14.5" xml:space="preserve"><tspan class="tx">        </tspan><tspan class="ky">createRule</tspan><tspan class="tx">: </tspan><tspan class="st">'true'</tspan><tspan class="tx">,</tspan></text>
<text class="mono" x="40" y="320" font-size="14.5" xml:space="preserve"><tspan class="tx">        </tspan><tspan class="ky">listRule</tspan><tspan class="tx">: </tspan><tspan class="st">'auth.uid == id'</tspan><tspan class="tx">,</tspan></text>
<text class="mono" x="40" y="344" font-size="14.5" xml:space="preserve"><tspan class="tx">        </tspan><tspan class="ky">updateRule</tspan><tspan class="tx">: </tspan><tspan class="st">'auth.uid == id'</tspan><tspan class="tx"> },</tspan></text>
<text class="mono" x="40" y="368" font-size="14.5" xml:space="preserve"><tspan class="tx">    ],</tspan></text>
<text class="mono" x="40" y="392" font-size="14.5" xml:space="preserve"><tspan class="tx">  }],</tspan></text>
<text class="mono" x="40" y="416" font-size="14.5" xml:space="preserve"><tspan class="tx">} satisfies DatabaseSettings</tspan></text>
<path class="ln" d="M534 240.0 H624"/>
<path class="ac" d="M626 240.0 l-10 -6 v12 z"/>
<text class="mono ac" x="580.0" y="228.0" font-size="12.5" text-anchor="middle">teeny deploy</text>
<rect class="card" x="640" y="20.0" width="380" height="65.0" rx="8"/>
<text class="sans tx" x="658" y="48.0" font-size="17" font-weight="600">REST API</text>
<text class="mono mu" x="658" y="72.0" font-size="13.5" xml:space="preserve">GET /api/v1/table/users/list</text>
<rect class="card" x="640" y="95.0" width="380" height="65.0" rx="8"/>
<text class="sans tx" x="658" y="123.0" font-size="17" font-weight="600">Auth</text>
<text class="mono mu" x="658" y="147.0" font-size="13.5" xml:space="preserve">sign-up, login-password, JWT, OAuth</text>
<rect class="card" x="640" y="170.0" width="380" height="65.0" rx="8"/>
<text class="sans tx" x="658" y="198.0" font-size="17" font-weight="600">Rules compiled to SQL</text>
<text class="mono mu" x="658" y="222.0" font-size="13.5" xml:space="preserve">auth.uid == id  →  WHERE clause</text>
<rect class="card" x="640" y="245.0" width="380" height="65.0" rx="8"/>
<text class="sans tx" x="658" y="273.0" font-size="17" font-weight="600">Migrations</text>
<text class="mono mu" x="658" y="297.0" font-size="13.5" xml:space="preserve">migrations/10000_create_table_users.sql</text>
<rect class="card" x="640" y="320.0" width="380" height="65.0" rx="8"/>
<text class="sans tx" x="658" y="348.0" font-size="17" font-weight="600">OpenAPI + Swagger UI</text>
<text class="mono mu" x="658" y="372.0" font-size="13.5" xml:space="preserve">/api/v1/doc/ui</text>
<rect class="card" x="640" y="395.0" width="380" height="65.0" rx="8"/>
<text class="sans tx" x="658" y="423.0" font-size="17" font-weight="600">Admin panel</text>
<text class="mono mu" x="658" y="447.0" font-size="13.5" xml:space="preserve">/api/v1/pocket/</text>
<rect class="band" x="20" y="478" width="1000" height="76" rx="10"/>
<text class="sans tx" x="520.0" y="522.0" font-size="18" text-anchor="middle"><tspan font-weight="600">Runs on your own Cloudflare account</tspan><tspan class="mu">  ·  Workers + D1</tspan></text>
</svg>
