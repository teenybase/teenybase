name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type-check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test-check
      - run: npm run vitest
      - run: npm run vitest-worker

  links:
    name: Docs link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm run linkcheck

  quickstart:
    name: Packed quickstart (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Create, install, deploy --local, dev, sign-up
        run: |
          version="$(node -p "require('./package.json').version")"
          bash scripts/ci-quickstart.sh "$RUNNER_TEMP/teenybase-$version.tgz" "$RUNNER_TEMP/quickstart"
