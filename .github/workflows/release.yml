name: Release

# Publishes teenybase to npm when a version tag (v0.1.0, v0.1.1, ...) is pushed.
# The tag must match "version" in package.json. Needs the NPM_TOKEN repository secret
# (an npm automation or granular token with publish rights on the teenybase package).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Test and publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version (expected v$version)."
            exit 1
          fi

      - run: npm ci
      - run: npm run check
      - run: npm run test-check
      - run: npm run vitest
      - run: npm run vitest-worker
      - run: npm run linkcheck

      # prepublishOnly runs "npm test" again before the upload. Prerelease versions
      # (0.2.0-beta.1) go to the "next" dist-tag so they never become "latest".
      - name: Publish
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) npm publish --provenance --access public --tag next ;;
            *) npm publish --provenance --access public ;;
          esac
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
